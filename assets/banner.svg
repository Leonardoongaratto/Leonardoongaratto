<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00add8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00add8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowYellow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd43b" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffd43b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00add8"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ffd43b"/>
    </linearGradient>
    <linearGradient id="nodes" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="type0"><rect x="70" y="170" height="50" width="0">
      <animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.15;0.30;0.333;1" values="0;760;760;0;0"/>
    </rect></clipPath>
    <clipPath id="type1"><rect x="70" y="170" height="50" width="0">
      <animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.333;0.483;0.633;0.666;1" values="0;0;760;760;0;0"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="70" y="170" height="50" width="0">
      <animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.666;0.816;0.966;1" values="0;0;760;760;0"/>
    </rect></clipPath>
  </defs>

  <rect width="1280" height="320" rx="16" fill="#0b0f17"/>
  <rect width="1280" height="320" rx="16" fill="url(#dots)"/>
  <circle cx="1020" cy="70" r="380" fill="url(#glowBlue)"/>
  <circle cx="560" cy="120" r="340" fill="url(#glowPurple)"/>
  <circle cx="1220" cy="320" r="300" fill="url(#glowYellow)"/>

  <text x="72" y="84" fill="#8b949e" font-size="20" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">~/leonardo $ whoami</text>
  <text x="70" y="150" fill="#ffffff" font-size="62" font-weight="700" letter-spacing="0.5">Leonardo Ongaratto</text>

  <g font-size="32" font-weight="600" fill="url(#accent)">
    <text x="70" y="206" clip-path="url(#type0)">Backend Go &amp; Python</text>
    <text x="70" y="206" clip-path="url(#type1)">Agentic AI &amp; LLMs em produção</text>
    <text x="70" y="206" clip-path="url(#type2)">Microsserviços · Mensageria · Kubernetes</text>
  </g>

  <text x="72" y="262" fill="#8b949e" font-size="20">Engenheiro de Software Sênior · Palmas, TO · Brasil</text>

  <g transform="translate(980 70)">
    <g stroke="url(#nodes)" stroke-width="3" opacity="0.9" fill="none">
      <line x1="30" y1="40" x2="110" y2="100"/><line x1="30" y1="160" x2="110" y2="100"/>
      <line x1="190" y1="40" x2="110" y2="100"/><line x1="190" y1="160" x2="110" y2="100"/>
      <line x1="30" y1="40" x2="190" y2="40"/><line x1="30" y1="160" x2="190" y2="160"/>
      <line x1="30" y1="40" x2="30" y2="160"/><line x1="190" y1="40" x2="190" y2="160"/>
    </g>
    <g fill="url(#nodes)">
      <circle cx="30" cy="40" r="11"/><circle cx="190" cy="40" r="11"/>
      <circle cx="30" cy="160" r="11"/><circle cx="190" cy="160" r="11"/>
      <circle cx="110" cy="100" r="22">
        <animate attributeName="r" dur="3s" repeatCount="indefinite" values="20;25;20"/>
      </circle>
    </g>
  </g>
</svg>
